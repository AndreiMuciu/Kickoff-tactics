name: Deploy

# Puts an image that is already on Docker Hub onto the server: copies the files
# in deploy/ to /opt/kickoff and runs deploy.sh there, which replaces Redis and
# both Go servers with fresh containers and waits for /healthz. The server's
# own /opt/kickoff/.env is never touched.
on:
  workflow_run:
    workflows: [Build and push]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy (a commit sha or "latest")
        required: true
        default: latest

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_sha }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DIR: /opt/kickoff
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check the tag
        run: |
          case "$TAG" in
            *[!A-Za-z0-9._-]*|"") echo "Invalid image tag."; exit 1 ;;
          esac

      - name: SSH key and host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host server"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config

      - name: Copy the stack files
        run: scp -p deploy/compose.yml deploy/Caddyfile deploy/deploy.sh "server:$DIR/"

      # Replaces Redis and both Go servers (one at a time) and waits for each
      # to answer /healthz; see deploy/deploy.sh.
      - name: Replace the containers
        run: ssh server "IMAGE_TAG=$TAG $DIR/deploy.sh"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
